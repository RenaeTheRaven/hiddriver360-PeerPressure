name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake

      - name: Build XexTool
        run: tools/build-xextool.sh

      - name: Installer tests
        run: python3 -m unittest discover -s tests -v

      - name: Build loaders (and check they reproduce loader/SHA256SUMS)
        run: |
          ./build.sh
          cd loader && sha256sum -c SHA256SUMS

      # The shareable Extra contains no PeerPressure files (PeerPressure is grimdoomer's, not part
      # of this project); Aurora is wired up on the user's console from their own copy.
      - name: Assemble the shareable Extra
        run: |
          python3 tools/make-extra.py --release
          if find dist/release -name 'AuroraFixer.orig.xex' | grep -q .; then
            echo "PeerPressure file in the release Extra" >&2; exit 1
          fi
          cp tools/install.py README.md LICENSE dist/release/

      - uses: actions/upload-artifact@v4
        with:
          name: hiddriver360-peerpressure
          path: dist/release/
          if-no-files-found: error
