; hiddriver360: load USB HID controller support when the Microsoft dashboard starts.
; PeerPressure only matches an entry if ModuleVersion (or MinVersion+MaxVersion) is set;
; "*.*.*.*" matches any version.
[DllConfig]
TitleID = 0xFFFE07D1
ModuleVersion = "*.*.*.*"
FileName = "HidDriver\HidLoader.xex"
