; hiddriver360: load USB HID controller support when FreeStyle Dash starts.
; PeerPressure only matches an entry if ModuleVersion (or MinVersion+MaxVersion) is set;
; "*.*.*.*" matches any version.
[DllConfig]
TitleID = 0xF5D20000
ModuleVersion = "*.*.*.*"
FileName = "HidDriver\HidLoader.xex"
